[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-billscanner"
version = "0.1.0"
description = "Servidor MCP para dimensionamento preliminar de sistemas solares"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.26.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
]

[project.scripts]
ai-billscanner = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
